<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Earthquake Application</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- Navigation -->
    <nav>

        <ul>

            <li>
                <a href="#">
                    Earthquake Alert
                </a>
            </li>

            <li class="hideonmobile">
                <a href="#">
                    Home
                </a>
            </li>

            <li class="hideonmobile">
                <a href="#">
                    Earthquakes
                </a>
            </li>

            <li class="hideonmobile">
                <a href="#">
                    Location
                </a>
            </li>

            <li class="menubutton">
                <a
                    href="#"
                    onclick="showsideBar(); return false;"
                >
                    ☰
                </a>
            </li>

        </ul>

    </nav>


    <!-- Sidebar -->
    <div class="sidebar">

        <ul>

            <li>
                <a
                    href="#"
                    onclick="hidesideBar(); return false;"
                >
                    ✕
                </a>
            </li>

            <li>
                <a href="#">
                    Home
                </a>
            </li>

            <li>
                <a href="#">
                    Earthquakes
                </a>
            </li>

            <li>
                <a href="#">
                    Location
                </a>
            </li>

        </ul>

    </div>


    <!-- Location Section -->
    <main>

        <div class="location-container">

            <h1>
                Your Location
            </h1>

            <button
                onclick="getUserLocation()"
            >
                Get My Location
            </button>

            <p>
                Latitude:
                <span id="latitude">
                    Not available
                </span>
            </p>

            <p>
                Longitude:
                <span id="longitude">
                    Not available
                </span>
            </p>

        </div>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
