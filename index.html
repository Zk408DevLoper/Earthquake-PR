<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Earthquake Alert</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <ul>
            <li>
                <a href="#">Earthquake Alert</a>
            </li>

            <li class="hideonmobile">
                <a href="#">Home</a>
            </li>

            <li class="hideonmobile">
                <a href="#location">Location</a>
            </li>

            <li class="hideonmobile">
                <a href="#earthquake">Earthquake</a>
            </li>

            <li class="menubutton">
                <a href="#" onclick="showsideBar(); return false;">☰</a>
            </li>
        </ul>
    </nav>

    <div class="sidebar">
        <ul>
            <li>
                <a href="#" onclick="hidesideBar(); return false;">✕</a>
            </li>

            <li>
                <a href="#">Home</a>
            </li>

            <li>
                <a href="#location">Location</a>
            </li>

            <li>
                <a href="#earthquake">Earthquake</a>
            </li>
        </ul>
    </div>

    <main>

        <section id="location" class="location-container">
            <h1>Your Location</h1>

            <button onclick="getUserLocation()">
                Get My Location
            </button>

            <p>
                Latitude:
                <span id="latitude">Not available</span>
            </p>

            <p>
                Longitude:
                <span id="longitude">Not available</span>
            </p>
        </section>

        <section id="earthquake" class="earthquake-container">
            <h1>Nearest Earthquake</h1>

            <div id="nearest-earthquake">
                <p>
                    Get your location to retrieve
                    the nearest earthquake.
                </p>
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
